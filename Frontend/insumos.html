<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGC - Clínica | Gestión de Insumos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">SGC Clínica</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="usuarios.html">Usuarios</a>
                <a class="nav-link active" href="insumos.html">Insumos</a>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mt-4">
        <h2 class="mb-4 text-primary fw-bold">Gestión de Insumos Médicos</h2>

        <!-- Tabla para Listar Insumos -->
        <div class="card p-4">
            <h5 class="mb-3">Inventario Actual de Insumos</h5>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre Insumo</th>
                        <th>Stock / Cantidad</th>
                    </tr>
                </thead>
                <tbody id="tablaInsumos">
                    <!-- Datos dinámicos -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Conexión -->
    <script>
        const API_URL = 'http://127.0.0.1:8000';

        async function cargarInsumos() {
            try {
                const response = await fetch(`${API_URL}/insumos`);
                const insumos = await response.json();
                const tbody = document.getElementById('tablaInsumos');
                tbody.innerHTML = '';
                
                insumos.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.id || 'N/A'}</td>
                            <td>${item.nombre}</td>
                            <td>${item.cantidad}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al obtener insumos:", error);
            }
        }

        window.onload = cargarInsumos;
    </script>
</body>
</html>
