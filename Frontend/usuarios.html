<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGC - Clínica | Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">SGC Clínica</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link active" href="usuarios.html">Usuarios</a>
                <a class="nav-link" href="insumos.html">Insumos</a>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mt-4">
        <h2 class="mb-4 text-primary fw-bold">Gestión de Usuarios</h2>

        <!-- Formulario para Registrar / Editar Usuario -->
        <div class="card p-4 mb-4">
            <h5 class="mb-3" id="formTitulo">Registrar / Modificar Usuario</h5>
            <form id="formUsuario">
                <!-- Campo oculto para almacenar el ID en modo edición -->
                <input type="hidden" id="usuarioId">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="correo" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="rol" class="form-label">Rol</label>
                    <select class="form-select" id="rol" required>
                        <option value="Auxiliar">Auxiliar</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Médico">Médico</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success" id="btnGuardar">Guardar Usuario</button>
                    <button type="button" class="btn btn-secondary" id="btnCancelar" onclick="limpiarFormulario()" style="display: none;">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- Tabla para Listar Usuarios -->
        <div class="card p-4">
            <h5 class="mb-3">Lista de Usuarios Registrados</h5>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <!-- Los datos se llenarán dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
<!-- Enlazamos el archivo de lógica JavaScript -->
    <script src="app.js"></script>
</body>
</html>
    
</body>
</html>
