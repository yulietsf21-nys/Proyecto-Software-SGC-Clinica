<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGC - Clínica | Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">SGC Clínica</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link active" href="usuarios.html">Usuarios</a>
                <a class="nav-link" href="insumos.html">Insumos</a>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mt-4">
        <h2 class="mb-4 text-primary fw-bold">Gestión de Usuarios</h2>

        <!-- Formulario para Registrar Usuario -->
        <div class="card p-4 mb-4">
            <h5 class="mb-3">Registrar Nuevo Usuario</h5>
            <form id="formUsuario">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" id="correo" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Guardar Usuario</button>
            </form>
        </div>

        <!-- Tabla para Listar Usuarios -->
        <div class="card p-4">
            <h5 class="mb-3">Lista de Usuarios Registrados</h5>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <!-- Los datos se llenarán dinámicamente con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script para conectar con el Backend -->
    <script>
        const API_URL = 'http://127.0.0.1:8000';

        // Función para cargar los usuarios (GET)
        async function cargarUsuarios() {
            try {
                const response = await fetch(`${API_URL}/usuarios`);
                const usuarios = await response.json();
                const tbody = document.getElementById('tablaUsuarios');
                tbody.innerHTML = '';
                
                usuarios.forEach(user => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${user.id || 'N/A'}</td>
                            <td>${user.nombre}</td>
                            <td>${user.correo}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al obtener usuarios:", error);
            }
        }

        // Manejar el envío del formulario (POST)
        document.getElementById('formUsuario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevoUsuario = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value
            };

            try {
                const response = await fetch(`${API_URL}/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoUsuario)
                });

                if (response.ok) {
                    alert('¡Usuario registrado con éxito!');
                    document.getElementById('formUsuario').reset();
                    cargarUsuarios();
                } else {
                    alert('Error al registrar el usuario.');
                }
            } catch (error) {
                console.error("Error en la petición POST:", error);
            }
        });

        // Cargar al iniciar la página
        window.onload = cargarUsuarios;
    </script>
</body>
</html>
