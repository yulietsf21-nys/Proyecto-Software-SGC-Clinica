<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGC - Clínica | Gestión de Atenciones</title>
    <!-- Bootstrap para un diseño limpio y rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">SGC Clínica</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="usuarios.html">Usuarios</a>
                <a class="nav-link" href="insumos.html">Insumos</a>
                <a class="nav-link active" href="atenciones.html">Atenciones</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-3">Gestión de Atenciones Médicas </h2>

        <!-- Formulario con Menú Desplegable (Select) para la Llave Foránea -->
        <div class="card p-4 shadow-sm mb-4">
            <h4>Registrar Nueva Atención</h4>
            <form id="formAtencion">
                <div class="mb-3">
                    <label class="form-label">Seleccionar Servicio Médico :</label>
                    <select id="id_servicio" class="form-select" required>
                        <option value="">Cargando servicios...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Área / Departamento:</label>
                    <input type="text" id="area_departamento" class="form-control" required placeholder="Ej. Urgencias, Consulta Externa">
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha de Atención:</label>
                    <input type="date" id="fecha_atencion" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Costo Total:</label>
                    <input type="number" step="0.01" id="costo_total" class="form-control" required placeholder="Ej. 150000">
                </div>
                <button type="submit" class="btn btn-success">Guardar Atención</button>
            </form>
        </div>

        <!-- Tabla para ver los registros -->
        <div class="card p-4 shadow-sm">
            <h4>Atenciones Registradas</h4>
            <table class="table table-striped mt-2">
                <thead>
                    <tr>
                        <th>ID Atención</th>
                        <th>ID Servicio</th>
                        <th>Área</th>
                        <th>Fecha</th>
                        <th>Costo Total</th>
                    </tr>
                </thead>
                <tbody id="tablaAtenciones">
                    <!-- Los datos se cargan dinámicamente con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script principal para consumir la API -->
    <script>
        const API_URL = "http://127.0.0.1:8000";

        // 1. Cargar los servicios en el menú desplegable (<select>) al abrir la página
        async function cargarServiciosSelect() {
            try {
                let respuesta = await fetch(`${API_URL}/servicios`);
                let servicios = await respuesta.json();
                let select = document.getElementById("id_servicio");
                select.innerHTML = '<option value="">Seleccione un servicio...</option>';
                servicios.forEach(s => {
                    select.innerHTML += `<option value="${s.id_servicio}">${s.nombre_servicio} - (${s.categoria})</option>`;
                });
            } catch (error) {
                console.error("Error al cargar servicios:", error);
            }
        }

        // 2. Cargar la lista de atenciones en la tabla
        async function cargarAtenciones() {
            try {
                let respuesta = await fetch(`${API_URL}/atenciones`);
                let atenciones = await respuesta.json();
                let tbody = document.getElementById("tablaAtenciones");
                tbody.innerHTML = "";
                atenciones.forEach(a => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${a.id_atencion || 'N/A'}</td>
                            <td>${a.id_servicio}</td>
                            <td>${a.area_departamento}</td>
                            <td>${a.fecha_atencion}</td>
                            <td>$ ${a.costo_total}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar atenciones:", error);
            }
        }

        // 3. Enviar el formulario para crear una nueva atención
        document.getElementById("formAtencion").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            let nuevaAtencion = {
                id_servicio: parseInt(document.getElementById("id_servicio").value),
                area_departamento: document.getElementById("area_departamento").value,
                fecha_atencion: document.getElementById("fecha_atencion").value,
                costo_total: parseFloat(document.getElementById("costo_total").value)
            };

            try {
                let respuesta = await fetch(`${API_URL}/atenciones`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(nuevaAtencion)
                });

                if (respuesta.ok) {
                    alert("¡Atención registrada con éxito!");
                    document.getElementById("formAtencion").reset();
                    cargarAtenciones();
                } else {
                    alert("Error al registrar la atención.");
                }
            } catch (error) {
                console.error("Error en la petición:", error);
            }
        });

        // Ejecutar funciones al cargar la página
        cargarServiciosSelect();
        cargarAtenciones();
    </script>
</body>
</html>
